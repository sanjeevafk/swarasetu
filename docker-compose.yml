version: "3.9"

services:
  backend:
    build: ./backend
    container_name: swarasetu-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://swarasetu:swarasetu@postgres:5432/swarasetu
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: swarasetu-postgres
    environment:
      POSTGRES_USER: swarasetu
      POSTGRES_PASSWORD: swarasetu
      POSTGRES_DB: swarasetu
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarasetu -d swarasetu"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: swarasetu-redis
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
