    intended_purpose: MT training/eval for health advisories
    training_allowed: false          # blocked until license clarified
    testing_allowed: false
    download_policy: manual_review

  - name: ekacare_bodhi_s
    source: Eka Care
    url: https://huggingface.co/datasets/ekacare/BODHI-S
    license: CC BY-NC 4.0
    license_verification: verified
