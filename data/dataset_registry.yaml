    access_requirements: share-alike attribution
    languages: [en, hi, bn, ta, te, kn, mr, ml]
    domain: multilingual medical term retrieval (SNOMED CT aligned)
    size: 2532 doctor-verified queries + qrels + corpus
    label_type: relevance pairs (qrels) - NOT triage
