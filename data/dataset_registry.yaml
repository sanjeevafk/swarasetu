# SwaraSetu Dataset Registry
# Canonical record of known datasets, their licenses/access terms, and usage policy.
# RULES:
#  - Training is ONLY permitted on entries with training_allowed: true.
#  - Restricted/credentialed datasets must NEVER be auto-downloaded (download_policy: manual).
#  - license_verification: pending => do not flip flags until license confirmed at source.
#  - source_label stays verbatim; mapping to SwaraSetu LOW/MEDIUM/HIGH happens only in
#    data/metadata/label_mapping.yaml reviewed by a clinician before benchmark use.

version: 1
updated: "2026-08-22"
triage_label_space: {LOW: 1, MEDIUM: 2, HIGH: 3}   # mirrors backend RiskScore

datasets:

  # ------------------------------------------------------------------ internal
  - name: swarasetu_triage_protocols_2251
    source: internal (repo root, provenance undocumented upstream)
    url: file://triage_protocols_structured.json
    license: unspecified (provenance undocumented in repo)
    license_verification: pending
    access_requirements: none (already in repo)
    languages: [en]
    domain: emergency-triage vignettes (India rural focus)
    size: 2251 cases
    label_type: triage_level enum {RED, YELLOW, GREEN, BLACK}
    intended_purpose: primary benchmark / regression gate
    training_allowed: false          # reserved exclusively as the held-out benchmark
    testing_allowed: true
    external_test_allowed: false     # internal benchmark, not an external corpus
    download_policy: local
    notes: BLACK currently maps to LOW via legacy map_ground_truth; needs clinical review.

  # ------------------------------------------------------------ triage corpora
  - name: tulsiandhare_multilingual_medical_symptom_triage
    source: Hugging Face (Tulsiandhare) - synthetic, author states "designed for training
      multilingual triage classification models"; HackIndia/AutoScientist submission
    url: https://huggingface.co/datasets/Tulsiandhare/Multilingual_medical_symptom_triage
    license: unspecified on HF card (synthetic data; no real patients)
    license_verification: pending
    access_requirements: none (public download)
    languages: [en, hi, hi-en (code-mixed)]   # tags unreliable: some 'hi-en' rows are Marathi script
    domain: symptom -> triage (urgency Low/Medium/High)
    size: 13923 rows observed in local copy
    label_type: urgency enum {Low, Medium, High} + severity + recommended_action free-text
    intended_purpose: training multilingual triage classifiers
    training_allowed: true           # synthetic; author-intended for training
    testing_allowed: true            # validation slices only, never the primary benchmark
    external_test_allowed: false     # CONSUMED by experiment_improved training - no longer unseen
    download_policy: auto_ok
    local_copy: data/external/multilingual_medical_symptom_triage.csv
    caveats: synthetic; language_tag quality uneven; verify script-vs-tag before language claims.

  - name: physionet_mietic
    source: PhysioNet (MIMIC-IV-Ext Triage Instruction Corpus v1.0.0)
    url: https://physionet.org/content/mietic/1.0.0/
    license: PhysioNet credentialed health data license (DUA)
    license_verification: verified
    access_requirements: PhysioNet account + CITI training + signed DUA
    languages: [en]
    domain: ED triage instructions (ESI-aligned)
    size: 9629 cases
    label_type: ESI 1-5
    intended_purpose: LLM/model triage training & evaluation
    training_allowed: true           # permitted under DUA for research
    testing_allowed: true
    external_test_allowed: true      # pending credentialed download
    download_policy: manual          # credentialed - never auto-download

  - name: mimic_iv_ed
    source: MIT-LCP via PhysioNet
    url: https://physionet.org/content/mimic-iv-ed/2.2/
    license: PhysioNet credentialed health data license (DUA)
    license_verification: verified
    access_requirements: PhysioNet credentialing + DUA
    languages: [en]
    domain: US emergency department records (Beth Israel)
    size: "~425k ED stays (v2.2)"
    label_type: acuity (ESI), disposition
    intended_purpose: external validation / pretraining research
    training_allowed: true
    testing_allowed: true
    external_test_allowed: true      # pending credentialed download
    download_policy: manual

  - name: yale_ed_triage_hong2018
    source: Yale EMMLC - de-identified Yale New Haven ED visits (Hong et al., PLoS ONE 2018)
    url: https://github.com/yaleemmlc/admissionprediction
    license: no explicit OSS license; citation of Hong WS et al. 2018 required
    license_verification: pending
    access_requirements: agree to cite paper; R/RData format (560,486 x 972)
    languages: [en]
    domain: US adult ED triage (Epic EHR)
    size: 560486 visits
    label_type: ESI level; admission outcome
    intended_purpose: external testing of triage models
    training_allowed: false          # hold out; license ambiguity + US-domain shift
    testing_allowed: true
    external_test_allowed: true      # pending manual review of citation terms
    download_policy: manual_review

  - name: nhamcs_ed
    source: CDC/NCHS National Hospital Ambulatory Medical Care Survey (ED public-use files)
    url: https://www.cdc.gov/nchs/nhamcs/
    license: public-use; statistical reporting/analysis only (PHS Act sec 308(d), CIPSEA)
    license_verification: verified
    access_requirements: none for public files (implicit agreement to terms of use)
    languages: [en]
    domain: US national ED visit survey
    size: "~20k ED visits/yr; 1992-2022 (final year 2022)"
    label_type: immediacy/wait-time categories + RFV reason-for-visit codes
    intended_purpose: external testing; survey-weighted calibration
    training_allowed: false          # conservative: terms say statistical analysis; not model-training redistribution
    testing_allowed: true
    external_test_allowed: true      # pending download + documented immediacy mapping review
    download_policy: auto_ok         # public FTP, but respect statistical-use-only terms
    caveats: immediacy != ESI != IMCI; mapping requires clinical review before scoring.

  - name: ihqid_webmd_1mg
    source: EACL Findings 2023 (arXiv:2302.09685) Indian Healthcare Query Intent Dataset
    url: https://arxiv.org/abs/2302.09685
    license: academic release; explicit license not stated in paper
    license_verification: pending
    access_requirements: contact authors / repo in paper
    languages: [en, hi, bn, ta, te, gu, mr]
    domain: healthcare query intent classification + entity (drug/disease/treatment) NER
    size: WebMD + 1mg FAQ queries + real Indian hospital queries
    label_type: intent labels + BIO entity spans (NOT triage levels)
    intended_purpose: NER/intent training for symptom normalization lexicons
    training_allowed: false          # blocked until license clarified
    testing_allowed: false
    download_policy: manual_review

  - name: indicmeddialog
