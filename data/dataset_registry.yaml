    url: https://aclanthology.org/2026.bionlp-1.84/
    license: not stated on landing page
    license_verification: pending
    access_requirements: authors' release channel TBD
    languages: [en, as, bn, gu, hi, mr, pa, ta, te, ur]
    domain: parallel multi-turn medical consultations
    size: 2980 dialogues x 10 languages = 29800 instances
    label_type: disease category (12 classes) - NOT triage levels
    intended_purpose: symptom-elicitation dialogue modeling
    training_allowed: false          # blocked until license clarified
    testing_allowed: false
    download_policy: manual_review

  - name: himed_freedomintelligence
